name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 0 * * *" # Daily certificate check
    - cron: "0 3 * * 0" # Weekly backup restore drill (Sundays 03:00 UTC)

jobs:
  cert-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Certificate Expiry Check
        run: npm run check-cert
        continue-on-error: true

  restore-drill:
    runs-on: ubuntu-latest
    # Run on the weekly schedule, or on demand via workflow_dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    services:
      # Isolated PostgreSQL instance used ONLY for the restore drill.
      # This is never the production database.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drill_user
          POSTGRES_PASSWORD: drill_password
          POSTGRES_DB: drill_source
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare source database and create backup
        env:
          PGPASSWORD: drill_password
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5432 PGUSER=drill_user
          # Seed the source database with the schema so a backup exists to restore.
          npm run migrate:up
          # Create a logical backup artifact (custom format).
          pg_dump --format=custom --file=/tmp/backup.dump drill_source
          echo "Backup created: $(du -h /tmp/backup.dump | cut -f1)"

      - name: Restore backup into isolated database
        env:
          PGPASSWORD: drill_password
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5432 PGUSER=drill_user
          # Create a fresh, isolated target database for the restore.
          createdb drill_restore
          # Restore the backup into the isolated database (not the source).
          pg_restore --dbname=drill_restore --no-owner --no-privileges /tmp/backup.dump
          echo "Restore completed into isolated database drill_restore"

      - name: Run schema and integrity checks on restored database
        env:
          PGPASSWORD: drill_password
        run: |
          set -euo pipefail
          export PGHOST=localhost PGPORT=5432 PGUSER=drill_user
          # Fail the drill if the restored database has no user tables.
          TABLE_COUNT=$(psql -tA -d drill_restore -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
          echo "Restored table count: ${TABLE_COUNT}"
          if [ "${TABLE_COUNT}" -lt 1 ]; then
            echo "::error::Restore drill failed: no tables found in restored database"
            exit 1
          fi
          # Verify the migrations table is present and consistent.
          psql -d drill_restore -c "SELECT count(*) AS applied_migrations FROM schema_migrations;"
          # Basic integrity check: ensure no invalid indexes exist.
          INVALID_INDEXES=$(psql -tA -d drill_restore -c "SELECT count(*) FROM pg_index WHERE NOT indisvalid;")
          echo "Invalid indexes: ${INVALID_INDEXES}"
          if [ "${INVALID_INDEXES}" -ne 0 ]; then
            echo "::error::Restore drill failed: invalid indexes detected"
            exit 1
          fi
          echo "Schema and integrity checks passed"

      - name: Record drill duration and results
        if: always()
        run: |
          set -euo pipefail
          STATUS="${{ job.status }}"
          DURATION="${{ github.event.repository.updated_at }}"
          REPORT_DIR=restore-drill-reports
          mkdir -p "${REPORT_DIR}"
          REPORT_FILE="${REPORT_DIR}/restore-drill-$(date -u +%Y%m%dT%H%M%SZ).json"
          cat > "${REPORT_FILE}" <<EOF
          {
            "drill": "backup-restore-verification",
            "status": "${STATUS}",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "duration_seconds": "$(date -u +%s)"
          }
          EOF
          echo "Drill report written to ${REPORT_FILE}"
          cat "${REPORT_FILE}"

      - name: Upload drill report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: restore-drill-reports/
          retention-days: 90
          if-no-files-found: ignore

      - name: Alert on failed drill
        if: failure()
        run: |
          echo "::error::Backup restore drill FAILED. Backups may not be operationally recoverable. See the restore-drill-report artifact for details."

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            bridge-starter-node/package-lock.json

      - name: Verify root package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json not found, generating it..."
            npm install --package-lock-only
          else
            echo "✅ package-lock.json found"
          fi

      - name: Install root dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run root npm audit for high vulnerabilities
        run: npm run audit:high
        continue-on-error: true

      - name: Check if Snyk is configured
        id: check_snyk
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "snyk_available=true" >> $GITHUB_OUTPUT
          else
            echo "snyk_available=false" >> $GITHUB_OUTPUT
            echo "⚠️ SNYK_TOKEN not configured. Skipping Snyk scan."
            echo "To enable Snyk scanning, add SNYK_TOKEN secret."
          fi

      - name: Setup Snyk CLI
        if: steps.check_snyk.outputs.snyk_available == 'true'
        uses: snyk/actions/setup@v1.0.0

      - name: Run root Snyk test for high vulnerabilities
        if: steps.check_snyk.outputs.snyk_available == 'true'
        run: npm run snyk:test:high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Verify bridge-starter-node package-lock.json exists
        working-directory: bridge-starter-node
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ bridge-starter-node/package-lock.json not found, generating it..."
            npm install --package-lock-only
          else
            echo "✅ bridge-starter-node/package-lock.json found"
          fi

      - name: Install bridge-starter-node dependencies without lifecycle scripts
        working-directory: bridge-starter-node
        run: npm ci --ignore-scripts

      - name: Run bridge-starter-node npm audit for high vulnerabilities
        working-directory: bridge-starter-node
        run: npm run audit:high
        continue-on-error: true

      - name: Run bridge-starter-node Snyk test for high vulnerabilities
        if: steps.check_snyk.outputs.snyk_available == 'true'
        working-directory: bridge-starter-node
        run: npm run snyk:test:high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libjpeg-dev libpng-dev libtiff-dev libgif-dev librsvg2-dev libpoppler-cpp-dev libcairo2-dev libpango1.0-dev libjpeg8-dev libgif-dev build-essential

      - name: Verify package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "⚠️ package-lock.json not found, generating it..."
            npm install --package-lock-only
          else
            echo "✅ package-lock.json found"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate migration files (static checks)
        run: npm run migrate:validate
        continue-on-error: false

      - name: Dry-run migrations against a fresh database
        run: npm run migrate:dry-run
        continue-on-error: false
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      - name: Run database migrations
        run: npm run migrate:up
        continue-on-error: false
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      - name: Run migration integration tests (up/down + per-migration rollback)
        run: npm run test:migrations
        continue-on-error: false
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

      - name: Run linter
        run: npm run lint
        continue-on-error: false

      - name: OpenAPI contract check
        run: npm run openapi:check
        continue-on-error: false

      - name: Run tests with coverage
        run: npm run test:coverage -- --maxWorkers=2 --forceExit
        timeout-minutes: 10
        continue-on-error: false
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          STELLAR_ISSUER_SECRET: S-DUMMY-SECRET-KEY-FOR-TESTING-PURPOSES-ONLY
          NODE_ENV: test
          CI: true

      - name: Run Pact Contract Tests
        run: npm run test:pact
        continue-on-error: false
        env:
          CI: true

      - name: Upload Pact files as artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pact-contracts
          path: pacts/
          retention-days: 30
          if-no-files-found: ignore

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npm run build
        continue-on-error: false

      - name: Start server for E2E
        run: node dist/src/index.js &
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          STELLAR_ISSUER_SECRET: S-DUMMY-SECRET-KEY-FOR-TESTING-PURPOSES-ONLY
          NODE_ENV: development
          JWT_SECRET: ci-jwt-secret-32-chars-long-ok-x
          SESSION_SECRET: ci-session-secret
          BUILD_HASH: ${{ github.sha }}

      - name: Wait for server to be ready
        run: npx wait-on http://127.0.0.1:3000/health --timeout 30000
        continue-on-error: false

      - name: Run Playwright e2e tests
        run: npx playwright test --project=chromium --workers=1 --retries=1 --reporter=dot
        continue-on-error: false
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          STELLAR_ISSUER_SECRET: S-DUMMY-SECRET-KEY-FOR-TESTING-PURPOSES-ONLY
          NODE_ENV: development
          JWT_SECRET: ci-jwt-secret-32-chars-long-ok-x
