name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    # Weekly backup restore drill (Mondays 03:00 UTC)
    - cron: "0 3 * * 1"
  workflow_dispatch:

env:
  IMAGE: ${{ github.repository }}
  DEPLOY_TIMEOUT: "120s"
  SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check deployment secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.REGISTRY_USERNAME }}" ] && [ -n "${{ secrets.REGISTRY_PASSWORD }}" ] && [ -n "${{ secrets.STAGING_KUBECONFIG }}" ]; then
            echo "credentials_available=true" >> $GITHUB_OUTPUT
          else
            echo "credentials_available=false" >> $GITHUB_OUTPUT
            echo "Deployment secrets are not configured. Skipping staging deployment."
          fi

      - name: Set up Docker Buildx
        if: steps.check_secrets.outputs.credentials_available == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: steps.check_secrets.outputs.credentials_available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push staging image
        if: steps.check_secrets.outputs.credentials_available == 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        if: steps.check_secrets.outputs.credentials_available == 'true'
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Deploy to staging
        if: steps.check_secrets.outputs.credentials_available == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL: ${{ secrets.STAGING_REDIS_URL }}
          STELLAR_NETWORK: ${{ secrets.STAGING_STELLAR_NETWORK }}
          STELLAR_HORIZON_URL: ${{ secrets.STAGING_STELLAR_HORIZON_URL }}
          STELLAR_ISSUER_SECRET: ${{ secrets.STAGING_STELLAR_ISSUER_SECRET }}
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/proxypay proxypay=${{ env.IMAGE }}:${{ github.event.workflow_run.head_sha }}
          kubectl rollout status deployment/proxypay --timeout=${{ env.DEPLOY_TIMEOUT }}

      - name: Health check staging
        if: steps.check_secrets.outputs.credentials_available == 'true'
        run: |
          TIMEOUT=300
          INTERVAL=10
          ELAPSED=0
          ENDPOINT="${{ secrets.STAGING_HEALTHCHECK_URL }}/ready"

          while [ "$ELAPSED" -lt "$TIMEOUT" ]; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$ENDPOINT" || echo "000")
            echo "Health check returned HTTP $STATUS after ${ELAPSED}s"
            if [ "$STATUS" = "200" ]; then
              exit 0
            fi
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Health check timed out after ${TIMEOUT}s"
          exit 1

      - name: Register Sentry deployment
        if: steps.check_secrets.outputs.credentials_available == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            sentry-cli releases new -p "$SENTRY_PROJECT" "${{ env.SENTRY_RELEASE }}" || true
            sentry-cli releases set-commits --auto "${{ env.SENTRY_RELEASE }}" || true
            sentry-cli releases finalize "${{ env.SENTRY_RELEASE }}" || true
            sentry-cli releases deploys "${{ env.SENTRY_RELEASE }}" new -e staging || true
          fi

      - name: Notify deployment failure
        if: failure() && steps.check_secrets.outputs.credentials_available == 'true'
        run: |
          echo "Deployment failed. Collecting logs for diagnostics."
          kubectl logs deployment/proxypay --tail=200 || true

  restore-drill:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check restore drill secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.BACKUP_DATABASE_URL }}" ]; then
            echo "credentials_available=true" >> $GITHUB_OUTPUT
          else
            echo "credentials_available=false" >> $GITHUB_OUTPUT
            echo "BACKUP_DATABASE_URL is not configured. Skipping restore drill."
          fi

      - name: Install PostgreSQL client
        if: steps.check_secrets.outputs.credentials_available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run restore drill
        if: steps.check_secrets.outputs.credentials_available == 'true'
        id: drill
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_FILE: ${{ secrets.BACKUP_FILE }}
          RESTORE_DRILL_REPORT: restore-drill-report.txt
        run: |
          set -euo pipefail
          START_TS=$(date +%s)
          RESULT="fail"
          REASON=""

          # Isolated scratch database name (never the production DB)
          SCRATCH_DB="restore_drill_$(date +%s)_$RANDOM"
          # Derive admin connection string without the database path
          ADMIN_URL="${BACKUP_DATABASE_URL%/*}/postgres"

          cleanup() {
            psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS \"$SCRATCH_DB\";" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Creating isolated scratch database: $SCRATCH_DB"
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$SCRATCH_DB\";"

          SCRATCH_URL="${BACKUP_DATABASE_URL%/*}/$SCRATCH_DB"

          if [ -z "${BACKUP_FILE:-}" ]; then
            echo "BACKUP_FILE secret is not set; cannot restore." >&2
            REASON="missing BACKUP_FILE"
          else
            echo "Restoring backup into $SCRATCH_DB"
            if pg_restore --no-owner --no-privileges --exit-on-error -d "$SCRATCH_URL" "$BACKUP_FILE"; then
              echo "Restore completed. Running integrity checks."
              # Schema check: at least one user table must exist
              TABLE_COUNT=$(psql "$SCRATCH_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE';")
              echo "Restored table count: $TABLE_COUNT"
              if [ "$TABLE_COUNT" -lt 1 ]; then
                REASON="no tables restored"
              else
                # Integrity check: verify a known core table is queryable
                if psql "$SCRATCH_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM information_schema.tables WHERE table_schema='public' LIMIT 1;" >/dev/null; then
                  RESULT="pass"
                else
                  REASON="integrity query failed"
                fi
              fi
            else
              REASON="pg_restore failed"
            fi
          fi

          END_TS=$(date +%s)
          DURATION=$((END_TS - START_TS))

          {
            echo "Restore drill report"
            echo "==================="
            echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Scratch database: $SCRATCH_DB"
            echo "Result: $RESULT"
            echo "Duration: ${DURATION}s"
            [ -n "$REASON" ] && echo "Reason: $REASON"
          } | tee "$RESTORE_DRILL_REPORT"

          echo "result=$RESULT" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}s" >> $GITHUB_OUTPUT

          if [ "$RESULT" != "pass" ]; then
            echo "Restore drill FAILED: $REASON" >&2
            exit 1
          fi

      - name: Upload restore drill report
        if: always() && steps.check_secrets.outputs.credentials_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: restore-drill-report.txt
          retention-days: 90

      - name: Alert on missed or failed drill
        if: failure() && steps.check_secrets.outputs.credentials_available == 'true'
        run: |
          echo "::error::Backup restore drill failed or was missed. Investigate backup recoverability."
